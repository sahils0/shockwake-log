name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
            cxx: g++
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y \
              cmake \
              build-essential \
              gcc-aarch64-linux-gnu \
              g++-aarch64-linux-gnu \
              libcurl4-openssl-dev:arm64
          else
            sudo apt-get update
            sudo apt-get install -y \
              cmake \
              build-essential \
              libcurl4-openssl-dev
          fi

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        if: matrix.arch == 'amd64'
        run: |
          cd build
          ctest --output-on-failure

      - name: Package binary
        run: |
          cd build/bin
          chmod +x swl
          tar -czf ../../../swl-linux-${{ matrix.arch }}.tar.gz \
            swl
          cp swl ../../../swl-linux-${{ matrix.arch }}
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swl-linux-${{ matrix.arch }}
          path: |
            swl-linux-${{ matrix.arch }}
            swl-linux-${{ matrix.arch }}.tar.gz

  source-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          git archive --format=tar.gz --prefix=swl-${GITHUB_REF_NAME}/ \
            -o swl-source.tar.gz HEAD

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: swl-source.tar.gz

  release:
    needs: [build, source-package]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: swl ${{ github.ref_name }}
          body: |
            ## swl ${{ github.ref_name }}

            Real-time log anomaly detection with contextual debugging.

            ### Installation

            **Binary (Linux amd64):**
            ```bash
            tar -xzf swl-linux-amd64.tar.gz
            sudo mv swl /usr/local/bin/
            ```

            **Binary (Linux arm64):**
            ```bash
            tar -xzf swl-linux-arm64.tar.gz
            sudo mv swl /usr/local/bin/
            ```

            **From source:**
            ```bash
            tar -xzf swl-source.tar.gz
            cd swl-*
            mkdir build && cd build
            cmake ..
            make
            sudo make install
            ```

            ### Quick Start
            ```bash
            swl --log /var/log/app.log --webhook https://discord.com/api/webhooks/...
            ```

            ### What's New
            - Real-time inotify-based file monitoring
            - Sliding context window (configurable)
            - Async webhook alerts (Discord/Slack) with retry
            - Incident report generation
            - Log rotation detection (mv/copy-truncate)
            - POSIX regex trigger support
            - Optimized for < 1MB memory
          files: |
            artifacts/swl-linux-amd64/swl-linux-amd64
            artifacts/swl-linux-amd64/swl-linux-amd64.tar.gz
            artifacts/swl-linux-arm64/swl-linux-arm64
            artifacts/swl-linux-arm64/swl-linux-arm64.tar.gz
            artifacts/source/swl-source.tar.gz
          draft: false
          prerelease: false
