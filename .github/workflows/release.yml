name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Package binary
        run: |
          cd build/bin
          chmod +x swl
          tar -czf ../../../swl-linux-amd64.tar.gz \
            swl
          cp swl ../../../swl-linux-amd64
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swl-linux-amd64
          path: |
            swl-linux-amd64
            swl-linux-amd64.tar.gz

  source-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          git archive --format=tar.gz --prefix=swl-${GITHUB_REF_NAME}/ \
            -o swl-source.tar.gz HEAD

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: swl-source.tar.gz

  release:
    needs: [build, source-package]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: swl ${{ github.ref_name }}
          body: |
            ## swl ${{ github.ref_name }}

            Real-time log anomaly detection with contextual debugging.

            ### Installation

            **Binary (Linux amd64):**
            ```bash
            tar -xzf swl-linux-amd64.tar.gz
            sudo mv swl /usr/local/bin/
            ```

            **From source:**
            ```bash
            tar -xzf swl-source.tar.gz
            cd swl-*
            mkdir build && cd build
            cmake ..
            make
            sudo make install
            ```

            ### Quick Start
            ```bash
            swl --log /var/log/app.log --webhook https://discord.com/api/webhooks/...
            ```

            ### What's New
            - Real-time inotify-based file monitoring
            - Sliding context window (configurable)
            - Async webhook alerts (Discord/Slack) with retry
            - Incident report generation
            - Log rotation detection (mv/copy-truncate)
            - POSIX regex trigger support
            - Optimized for < 1MB memory
          files: |
            artifacts/swl-linux-amd64/swl-linux-amd64
            artifacts/swl-linux-amd64/swl-linux-amd64.tar.gz
            artifacts/source/swl-source.tar.gz
          draft: false
          prerelease: false
